[project]
name = "chatledger-core"
version = "0.1.0"
description = "ChatLedger shared domain, use cases and infrastructure adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatledger_core"]
