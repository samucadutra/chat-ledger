# ChatLedger local stack: `docker compose up` from the repository root.
name: chatledger

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://chatledger:chatledger@db:5432/chatledger
  BLOB_ROOT: /data/blobs
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: UTC
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
  JOB_LEASE_RENEW_SECONDS: ${JOB_LEASE_RENEW_SECONDS:-20}
  JOB_SWEEP_INTERVAL_SECONDS: ${JOB_SWEEP_INTERVAL_SECONDS:-15}
  JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-1.0}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  JOB_RETRY_BACKOFF_SECONDS: ${JOB_RETRY_BACKOFF_SECONDS:-5}
  HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-10}
  WORKER_ACTIVE_WINDOW_SECONDS: ${WORKER_ACTIVE_WINDOW_SECONDS:-30}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chatledger
      POSTGRES_PASSWORD: chatledger
      POSTGRES_DB: chatledger
      TZ: UTC
      PGTZ: UTC
    ports:
      # Override with CHATLEDGER_DB_PORT (e.g. in .env) if 5432 is taken on the host.
      - "${CHATLEDGER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatledger -d chatledger"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: chatledger-api:local
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - blobstore:/data/blobs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: chatledger-worker:local
    environment: *app-env
    volumes:
      - blobstore:/data/blobs
    depends_on:
      api:
        condition: service_healthy # migrations are applied by the api entrypoint
    deploy:
      replicas: 2
    # Graceful SIGTERM: the worker finishes its current job before exiting.
    stop_grace_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: chatledger-web:local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      TZ: UTC
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  blobstore:
