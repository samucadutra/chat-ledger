[project]
name = "chatledger"
version = "0.1.0"
description = "ChatLedger monorepo (uv workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chatledger-core",
    "chatledger-api",
    "chatledger-worker",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "import-linter>=2.1",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
chatledger-core = { workspace = true }
chatledger-api = { workspace = true }
chatledger-worker = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["chatledger_core", "chatledger_api", "chatledger_worker", "factories", "check_coverage"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:apps/api:apps/worker"
explicit_package_bases = true
exclude = ["^tests/fixtures/", "^apps/web/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --import-mode=importlib"
testpaths = [
    "packages/core/tests",
    "apps/api/tests",
    "apps/worker/tests",
    "scripts/tests",
    "tests/architecture",
]
pythonpath = ["packages/core/tests", "scripts"]
markers = ["integration: requires PostgreSQL at TEST_DATABASE_URL"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = false
source = [
    "packages/core/chatledger_core",
    "apps/api/chatledger_api",
    "apps/worker/chatledger_worker",
]
omit = ["*/migrations/versions/*"]

[tool.coverage.report]
show_missing = false
skip_empty = false

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["chatledger_core", "chatledger_api", "chatledger_worker"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core layering: infra -> usecase -> domain"
type = "layers"
layers = [
    "chatledger_core.infra",
    "chatledger_core.usecase",
    "chatledger_core.domain",
]

[[tool.importlinter.contracts]]
name = "Only composition roots and migrations read configuration"
type = "forbidden"
source_modules = [
    "chatledger_core.domain",
    "chatledger_core.usecase",
    "chatledger_core.infra",
    "chatledger_core.parsing",
    "chatledger_core.model",
    "chatledger_core.gates",
]
forbidden_modules = ["chatledger_core.config"]

[[tool.importlinter.contracts]]
name = "Core never imports the apps"
type = "forbidden"
source_modules = ["chatledger_core"]
forbidden_modules = ["chatledger_api", "chatledger_worker"]

[[tool.importlinter.contracts]]
name = "API and worker are independent"
type = "independence"
modules = ["chatledger_api", "chatledger_worker"]
