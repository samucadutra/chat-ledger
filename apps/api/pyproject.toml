[project]
name = "chatledger-api"
version = "0.1.0"
description = "ChatLedger HTTP API (FastAPI composition root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chatledger-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
chatledger-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatledger_api"]
