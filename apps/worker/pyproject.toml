[project]
name = "chatledger-worker"
version = "0.1.0"
description = "ChatLedger background worker and admin CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["chatledger-core"]

[project.scripts]
chatledger-worker = "chatledger_worker.main:main"
chatledger-admin = "chatledger_worker.admin_cli:main"

[tool.uv.sources]
chatledger-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatledger_worker"]
